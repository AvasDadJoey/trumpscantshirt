<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoplay Vimeo Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="vimeoPlayer"
            src="https://player.vimeo.com/video/1056164717?autoplay=1&loop=1&muted=1&playsinline=1" 
            allow="autoplay; fullscreen" allowfullscreen></iframe>

    <script>
        window.onload = function () {
            var iframe = document.getElementById('vimeoPlayer');
            var player = new URL(iframe.src);
            player.searchParams.set("autoplay", "1");
            player.searchParams.set("muted", "0"); // Try forcing sound
            iframe.src = player.toString();
        };
    </script>
</body>
</html>
